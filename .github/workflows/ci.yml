name: CI

# Build/lint/typecheck automático em todo push e PR para a master.
# Serve de gate: o build do Vercel e a branch só passam se isto ficar verde.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    # O repositório não versiona mais o .env (ver SECURITY.md). Estes valores
    # são apenas stubs: o build do Next importa os módulos mas não conecta no
    # banco nem assina tokens.
    env:
      MONGODB_URI: "mongodb://127.0.0.1:27017/build-stub"
      JWT_SECRET: "ci-only-dummy-secret"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build